services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static_collected:/static:ro
    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    build: .
    environment:
      - PORT=5001
      - DJANGO_SETTINGS_MODULE=auth_project.settings
      - POSTGRES_DB=mydb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DJANGO_SUPERUSER_PASSWORD=admin123
    depends_on:
      - db
    volumes:
      - ./static_collected:/app/static_collected
  command: /bin/sh -c "python manage.py migrate --noinput && python manage.py createsuperuser --noinput || true && python manage.py collectstatic --noinput && gunicorn auth_project.wsgi:application --bind 0.0.0.0:${PORT:-5001} --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60}"

  backend2:
    build: .
    environment:
      - PORT=5002
      - DJANGO_SETTINGS_MODULE=auth_project.settings
      - POSTGRES_DB=mydb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db
    volumes:
      - ./static_collected:/app/static_collected
    command: /bin/sh -c "python manage.py collectstatic --noinput && gunicorn auth_project.wsgi:application --bind 0.0.0.0:${PORT:-5002} --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60}"

  backend3:
    build: .
    environment:
      - PORT=5003
      - DJANGO_SETTINGS_MODULE=auth_project.settings
      - POSTGRES_DB=mydb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db
    volumes:
      - ./static_collected:/app/static_collected
    command: /bin/sh -c "python manage.py collectstatic --noinput && gunicorn auth_project.wsgi:application --bind 0.0.0.0:${PORT:-5003} --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60}"

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
