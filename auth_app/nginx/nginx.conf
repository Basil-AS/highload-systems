proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=dynamic_cache:10m inactive=30s max_size=100m;

map $request_method $bypass_cache {
    default 0;
    POST 1;
}

limit_req_zone $binary_remote_addr zone=antishkval:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=data_limit:10m rate=5r/s;

upstream backend {
    least_conn;
    server web:8000; # fallback single web if others not defined
    server backend1:5001 backup;
    server backend2:5002 backup;
    server backend3:5003 backup;
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Статика: кэш на 1 час, ETag добавляется автоматически при sendfile/last-modified
    location /static/ {
        alias /static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        etag on;
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /data {
        proxy_pass http://backend/data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache dynamic_cache;
        proxy_cache_bypass $bypass_cache;
        proxy_no_cache $bypass_cache;
        proxy_cache_valid 200 30s;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=data_limit burst=5 nodelay;
    }

    location /status {
        proxy_pass http://backend/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=antishkval burst=10 nodelay;
    }

    location /error {
        proxy_pass http://backend/error;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache dynamic_cache;
        proxy_cache_valid 200 30s; # кэшируем только 200
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache dynamic_cache;
        proxy_cache_bypass $bypass_cache;
        proxy_no_cache $bypass_cache;
        proxy_cache_valid 200 30s;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=antishkval burst=10 nodelay;
    }
}
