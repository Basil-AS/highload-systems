# DNS-балансировка (Round Robin DNS) для поисковой системы
# Симуляция гео-распределенной инфраструктуры

# Отключаем системные DNS
no-resolv

# Логирование
log-queries
log-facility=/var/log/dnsmasq.log

# Настройка интерфейса
interface=lo
bind-interfaces

# Порт DNS
port=5353

# Не использовать /etc/hosts
no-hosts

# Round Robin DNS для search.local (гео-зона: localhost)
# Эмулируем 3 инстанса nginx в разных "дата-центрах"
address=/search.local/127.0.0.1
address=/search.local/127.0.0.2
address=/search.local/127.0.0.3

# Round Robin для API endpoints
address=/api.search.local/127.0.0.1
address=/api.search.local/127.0.0.2

# Monitoring endpoints (без балансировки)
address=/prometheus.search.local/127.0.0.1
address=/grafana.search.local/127.0.0.1

# Database endpoints (Primary/Secondary)
address=/db-primary.search.local/127.0.0.1
address=/db-secondary.search.local/127.0.0.2

# Время кэширования (TTL)
min-cache-ttl=60
max-cache-ttl=3600

# Размер кэша
cache-size=1000
