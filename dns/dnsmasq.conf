# Мы настраиваем Round Robin DNS для проекта
# Мы эмулируем несколько площадок

# Мы отключаем системные DNS
no-resolv

# Мы включаем логи
log-queries
log-facility=/var/log/dnsmasq.log

# Слушаем на всех интерфейсах, включая loopback (для работы с хоста через Docker port mapping)
# interface=eth0  # Закомментировано - слушаем на всех интерфейсах
# bind-interfaces  # Закомментировано - позволяет слушать на 0.0.0.0
port=53

# Мы не трогаем /etc/hosts
no-hosts

# Round Robin DNS с реальными IP-адресами контейнеров
host-record=search.lab,172.30.0.11
host-record=search.lab,172.30.0.12
host-record=search.lab,172.30.0.13

# API домен
host-record=api.search.lab,172.30.0.11
host-record=api.search.lab,172.30.0.12

# Мониторинг на dnsmasq
host-record=prometheus.search.lab,172.30.0.10
host-record=grafana.search.lab,172.30.0.10

# Базы данных
host-record=db-primary.search.lab,172.30.0.11
host-record=db-secondary.search.lab,172.30.0.12

# Мы задаём TTL
min-cache-ttl=60
max-cache-ttl=3600

# Мы ставим размер кэша
cache-size=1000
