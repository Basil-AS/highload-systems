# Production Docker Compose with PostgreSQL Auto-Failover
# Использует pg_auto_failover для автоматического failover

version: '3.8'

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  pg-monitor-data:
  pg-node1-data:
  pg-node2-data:
  prometheus-data:
  grafana-data:

services:
  # =====================================================
  # PostgreSQL Auto-Failover Monitor
  # =====================================================
  pg-monitor:
    image: citusdata/pg_auto_failover:latest
    container_name: search-pg-monitor
    environment:
      PGDATA: /home/postgres/pgdata/monitor
    ports:
      - "5434:5432"
    volumes:
      - pg-monitor-data:/home/postgres/pgdata
    networks:
      - backend
    command: ["bash", "-lc", "pg_autoctl create monitor --pgdata $$PGDATA --pgport 5432 --auth trust --ssl-self-signed --hostname pg-monitor && (grep -q 'host all all 0.0.0.0/0 trust' $$PGDATA/pg_hba.conf || echo 'host all all 0.0.0.0/0 trust' >> $$PGDATA/pg_hba.conf) && pg_autoctl run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoctl_node -d pg_auto_failover"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # PostgreSQL Primary Node
  # =====================================================
  postgres-primary:
    image: citusdata/pg_auto_failover:latest
    container_name: search-postgres-primary
    environment:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATA: /home/postgres/pgdata/node1
    ports:
      - "5432:5432"
    volumes:
      - pg-node1-data:/home/postgres/pgdata
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    depends_on:
      pg-monitor:
        condition: service_healthy
    command: ["bash", "-lc", "pg_autoctl create postgres --pgdata $$PGDATA --pgport 5432 --username postgres --dbname postgres --monitor postgres://autoctl_node@pg-monitor:5432/pg_auto_failover --auth trust --ssl-self-signed --hostname postgres-primary && (grep -q 'host all all 0.0.0.0/0 trust' $$PGDATA/pg_hba.conf || echo 'host all all 0.0.0.0/0 trust' >> $$PGDATA/pg_hba.conf) && pg_autoctl run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # PostgreSQL Standby Node
  # =====================================================
  postgres-standby:
    image: citusdata/pg_auto_failover:latest
    container_name: search-postgres-standby
    environment:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATA: /home/postgres/pgdata/node2
    ports:
      - "5433:5432"
    volumes:
      - pg-node2-data:/home/postgres/pgdata
    networks:
      - backend
    depends_on:
      pg-monitor:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    command: ["bash", "-lc", "pg_autoctl create postgres --pgdata $$PGDATA --pgport 5432 --username postgres --dbname postgres --monitor postgres://autoctl_node@pg-monitor:5432/pg_auto_failover --auth trust --ssl-self-signed --hostname postgres-standby && (grep -q 'host all all 0.0.0.0/0 trust' $$PGDATA/pg_hba.conf || echo 'host all all 0.0.0.0/0 trust' >> $$PGDATA/pg_hba.conf) && pg_autoctl run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # ValKey (Redis-compatible cache)
  # =====================================================
  valkey:
    image: valkey/valkey:7-alpine
    container_name: search-valkey
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =====================================================
  # RabbitMQ
  # =====================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: search-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # User Service
  # =====================================================
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: search-user-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/users_db
      REDIS_URL: redis://valkey:6379/0
      SECRET_KEY: your-secret-key-change-in-production
      AUDIT_SERVICE_URL: http://audit-service:8000
    networks:
      - backend
    depends_on:
      postgres-primary:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =====================================================
  # Document Service
  # =====================================================
  document-service:
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
    container_name: search-document-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/documents_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUDIT_SERVICE_URL: http://audit-service:8000
    networks:
      - backend
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =====================================================
  # Search Service (reads from Standby)
  # =====================================================
  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: search-search-service
    environment:
      DATABASE_URL_READ: postgresql://postgres:postgres@postgres-standby:5432/search_db
      DATABASE_URL_WRITE: postgresql://postgres:postgres@postgres-primary:5432/search_db
      REDIS_URL: redis://valkey:6379/1
    networks:
      - backend
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-standby:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =====================================================
  # Indexer Worker
  # =====================================================
  indexer-worker:
    build:
      context: ./services/indexer-worker
      dockerfile: Dockerfile
    container_name: search-indexer-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/search_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://valkey:6379/1
    networks:
      - backend
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # =====================================================
  # Audit Service
  # =====================================================
  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: search-audit-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/audit_db
    networks:
      - backend
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =====================================================
  # Nginx Gateway
  # =====================================================
  nginx:
    image: nginx:alpine
    container_name: search-nginx
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/static:/usr/share/nginx/html:ro
    networks:
      - frontend
      - backend
    depends_on:
      user-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =====================================================
  # Prometheus
  # =====================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: search-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # =====================================================
  # Grafana
  # =====================================================
  grafana:
    image: grafana/grafana:latest
    container_name: search-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - backend
    depends_on:
      - prometheus
