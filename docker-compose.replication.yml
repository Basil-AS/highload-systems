# Docker Compose для тестирования с pg_auto_failover репликацией
# Использует существующую pg_auto инфраструктуру

networks:
  backend:
    external: true
    name: pg_auto_default
  frontend:
    driver: bridge

services:
  # =====================================================
  # ValKey (Redis-compatible cache)
  # =====================================================
  valkey:
    image: valkey/valkey:7-alpine
    container_name: search-valkey
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =====================================================
  # RabbitMQ
  # =====================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: search-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # User Service
  # =====================================================
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: search-user-service
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/users_db
      REDIS_URL: redis://valkey:6379/0
      SECRET_KEY: your-secret-key-change-in-production
      AUDIT_SERVICE_URL: http://audit-service:8000
    networks:
      - backend
    depends_on:
      valkey:
        condition: service_healthy

  # =====================================================
  # Document Service
  # =====================================================
  document-service:
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
    container_name: search-document-service
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/documents_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUDIT_SERVICE_URL: http://audit-service:8000
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy

  # =====================================================
  # Search Service (reads from Standby node2)
  # =====================================================
  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: search-search-service
    environment:
      DATABASE_URL_READ: postgresql://docker:secret@pgauto-node2:5432/search_db
      DATABASE_URL_WRITE: postgresql://docker:secret@pgauto-node1:5432/search_db
      REDIS_URL: redis://valkey:6379/1
    networks:
      - backend
    depends_on:
      valkey:
        condition: service_healthy

  # =====================================================
  # Indexer Worker
  # =====================================================
  indexer-worker:
    build:
      context: ./services/indexer-worker
      dockerfile: Dockerfile
    container_name: search-indexer-worker
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/search_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://valkey:6379/1
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # =====================================================
  # Audit Service
  # =====================================================
  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: search-audit-service
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/audit_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy

  # =====================================================
  # Nginx Gateway
  # =====================================================
  nginx:
    image: nginx:alpine
    container_name: search-nginx
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/static:/usr/share/nginx/html:ro
    networks:
      - frontend
      - backend
    depends_on:
      - user-service
      - document-service
      - search-service
      - audit-service

  # =====================================================
  # Prometheus
  # =====================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: search-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # =====================================================
  # Grafana
  # =====================================================
  grafana:
    image: grafana/grafana:latest
    container_name: search-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - backend
    depends_on:
      - prometheus
