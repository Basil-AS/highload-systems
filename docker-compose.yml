services:
  # =====================================================
  # API Gateway (Nginx)
  # =====================================================
  nginx:
    build: ./services/gateway
    container_name: search-nginx-canary
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # =====================================================
  # Microservices - Canary Deployment
  # =====================================================
  # User Service v1 (80% трафика)
  user-service-v1:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: search-user-service-v1
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/app_db
      VALKEY_URL: redis://valkey:6379/0
      AUDIT_SERVICE_URL: http://audit-service:8000
      VERSION: "v1"
    networks:
      - backend
      - pg_auto_default
    restart: unless-stopped

  # User Service v2 (20% трафика - canary)
  user-service-v2:
    build:
      context: ./services/user-service-v2
      dockerfile: Dockerfile
    container_name: search-user-service-v2
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/app_db
      VALKEY_URL: redis://valkey:6379/0
      AUDIT_SERVICE_URL: http://audit-service:8000
      VERSION: "v2"
    networks:
      - backend
      - pg_auto_default
    restart: unless-stopped

  document-service:
    build: ./services/document-service
    container_name: search-document-service
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/app_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AUDIT_SERVICE_URL: http://audit-service:8000
    networks:
      - backend
      - pg_auto_default
    restart: unless-stopped

  search-service:
    build: ./services/search-service
    container_name: search-search-service
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/app_db
      VALKEY_URL: redis://valkey:6379/1
    networks:
      - backend
      - pg_auto_default
    restart: unless-stopped

  indexer-worker:
    build: ./services/indexer-service
    container_name: search-indexer-worker
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/app_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      VALKEY_URL: redis://valkey:6379/1
    networks:
      - backend
      - pg_auto_default
    restart: unless-stopped

  audit-service:
    build: ./services/audit-service
    container_name: search-audit-service
    environment:
      DATABASE_URL: postgresql://docker:secret@pgauto-node1:5432/app_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
    networks:
      - backend
      - pg_auto_default
    restart: unless-stopped

  # =====================================================
  # Cache (ValKey - Redis compatible)
  # =====================================================
  valkey:
    image: valkey/valkey:7-alpine
    container_name: search-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # =====================================================
  # Message Queue (RabbitMQ)
  # =====================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: search-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # =====================================================
  # Monitoring (Prometheus)
  # =====================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: search-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
    restart: unless-stopped

  # =====================================================
  # Monitoring (Grafana)
  # =====================================================
  grafana:
    image: grafana/grafana:latest
    container_name: search-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - backend
    restart: unless-stopped

  # =====================================================
  # Exporters
  # =====================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: search-nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx:80/stub_status'
    ports:
      - "9113:9113"
    networks:
      - backend
      - frontend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  pg_auto_default:
    external: true

volumes:
  valkey-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
