version: '3.9'

services:
  # =====================================================
  # API Gateway (Nginx)
  # =====================================================
  nginx:
    build: ./services/gateway
    container_name: search-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/static:/usr/share/nginx/html:ro
    depends_on:
      - user-service
      - document-service
      - search-service
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # =====================================================
  # Microservices
  # =====================================================
  user-service:
    build: ./services/user-service
    container_name: search-user-service
    environment:
      DATABASE_URL: postgresql://docker:secret@postgres-primary:5432/users_db
      VALKEY_URL: redis://valkey:6379/0
      AUDIT_SERVICE_URL: http://audit-service:8000
    depends_on:
      postgres-primary:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 2

  document-service:
    build: ./services/document-service
    container_name: search-document-service
    environment:
      DATABASE_URL: postgresql://docker:secret@postgres-primary:5432/documents_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUDIT_SERVICE_URL: http://audit-service:8000
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 2

  search-service:
    build: ./services/search-service
    container_name: search-search-service
    environment:
      DATABASE_URL_READ: postgresql://docker:secret@postgres-standby:5432/search_db
      DATABASE_URL_WRITE: postgresql://docker:secret@postgres-primary:5432/search_db
      VALKEY_URL: redis://valkey:6379/1
    depends_on:
      postgres-primary:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 3  # 3 реплики для критичного сервиса поиска

  indexer-worker:
    build: ./services/indexer-worker
    container_name: search-indexer-worker
    environment:
      DATABASE_URL: postgresql://docker:secret@postgres-primary:5432/search_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      VALKEY_URL: redis://valkey:6379/1
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 5  # 5 воркеров для параллельной индексации

  audit-service:
    build: ./services/audit-service
    container_name: search-audit-service
    environment:
      DATABASE_URL: postgresql://docker:secret@postgres-primary:5432/audit_db
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # =====================================================
  # Databases (PostgreSQL with replication)
  # =====================================================
  postgres-primary:
    image: postgres:16-alpine
    container_name: search-postgres-primary
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: secret
      POSTGRES_MULTIPLE_DATABASES: users_db,documents_db,search_db,audit_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: |
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on

  postgres-standby:
    image: postgres:16-alpine
    container_name: search-postgres-standby
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres-standby-data:/var/lib/postgresql/data
    networks:
      - backend
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Note: Реальная настройка репликации требует дополнительных скриптов
    # Для упрощения используем отдельную ноду, настройка репликации в скриптах

  # =====================================================
  # Cache (ValKey - Redis compatible)
  # =====================================================
  valkey:
    image: valkey/valkey:7-alpine
    container_name: search-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # =====================================================
  # Message Queue (RabbitMQ)
  # =====================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: search-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # =====================================================
  # Monitoring (Prometheus)
  # =====================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: search-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
    restart: unless-stopped

  # =====================================================
  # Monitoring (Grafana)
  # =====================================================
  grafana:
    image: grafana/grafana:latest
    container_name: search-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - backend
    restart: unless-stopped

  # =====================================================
  # Exporters
  # =====================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: search-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://docker:secret@postgres-primary:5432/postgres?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - backend
    depends_on:
      - postgres-primary
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: search-nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx:80/stub_status'
    ports:
      - "9113:9113"
    networks:
      - backend
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres-primary-data:
  postgres-standby-data:
  valkey-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
