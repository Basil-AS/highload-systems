global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'user-service-v1'
    static_configs:
      - targets: ['search-user-service-v1:8000']
        labels:
          service: 'user-service'
          version: 'v1'

  - job_name: 'user-service-v2'
    static_configs:
      - targets: ['search-user-service-v2:8000']
        labels:
          service: 'user-service'
          version: 'v2'

  - job_name: 'document-service'
    static_configs:
      - targets: ['search-document-service:8000']
        labels:
          service: 'document-service'

  - job_name: 'search-service'
    static_configs:
      - targets: ['search-search-service:8000']
        labels:
          service: 'search-service'

  - job_name: 'audit-service'
    static_configs:
      - targets: ['search-audit-service:8000']
        labels:
          service: 'audit-service'
