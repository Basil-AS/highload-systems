global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'search-system-lr4'
    environment: 'production'

# Alerting configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (for alerting)
# rule_files:
#   - "alerts.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'

  # ValKey (Redis) metrics
  - job_name: 'valkey'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'valkey'

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'

  # User Service metrics
  - job_name: 'user-service'
    static_configs:
      - targets: 
          - 'user-service-v1:8000'
          - 'user-service-v2:8000'
        labels:
          service: 'user-service'

  # Document Service metrics
  - job_name: 'document-service'
    static_configs:
      - targets:
          - 'document-service:8000'
        labels:
          service: 'document-service'

  # Search Service metrics
  - job_name: 'search-service'
    static_configs:
      - targets:
          - 'search-service:8000'
        labels:
          service: 'search-service'

  # Audit Service metrics
  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:8000']
        labels:
          service: 'audit-service'

  # RabbitMQ metrics (если добавить exporter)
  # - job_name: 'rabbitmq'
  #   static_configs:
  #     - targets: ['rabbitmq-exporter:9419']
  #       labels:
  #         service: 'rabbitmq'
