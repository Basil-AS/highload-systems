global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'search-system-lr4'
    environment: 'production'

# Мы можем подключить alertmanager (пока не используем)
# alerting (пример):
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Мы можем подключить правила алертов
# rule_files (пример):
#   - "alerts.yml"

scrape_configs:
  # Мы снимаем метрики самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Мы можем добавить экспортёр PostgreSQL
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgresql'

  # Мы можем подключить экспортёр ValKey
  # - job_name: 'valkey'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'valkey'

  # Мы собираем метрики nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'

  # Мы собираем метрики user-сервисов
  - job_name: 'user-service'
    static_configs:
      - targets: 
          - 'user-service-v1:8000'
          - 'user-service-v2:8000'
        labels:
          service: 'user-service'

  # Мы собираем метрики document-сервиса
  - job_name: 'document-service'
    static_configs:
      - targets:
          - 'document-service:8000'
        labels:
          service: 'document-service'

  # Мы собираем метрики search-сервиса
  - job_name: 'search-service'
    static_configs:
      - targets:
          - 'search-service:8000'
        labels:
          service: 'search-service'

  # Мы собираем метрики audit-сервиса
  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:8000']
        labels:
          service: 'audit-service'

  # Мы можем добавить экспортёр RabbitMQ
  # - job_name: 'rabbitmq'
  #   static_configs:
  #     - targets: ['rabbitmq-exporter:9419']
  #       labels:
  #         service: 'rabbitmq'
