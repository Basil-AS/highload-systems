# Мы настраиваем nginx для канарейки
# Мы делим трафик 90/10 между версиями

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Мы задаём формат логов
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "upstream=$upstream_addr" "version=$backend_version"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Мы настраиваем кеш
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m;

    # Мы описываем основной user upstream
    upstream user_service_v1 {
        server search-user-service-v1:8000;
    }

    # Мы описываем канареечный user upstream
    upstream user_service_v2 {
        server search-user-service-v2:8000;
    }

    # Мы описываем остальные сервисы
    upstream document_service {
        server search-document-service:8000;
    }

    upstream search_service {
        server search-search-service:8000;
    }

    upstream audit_service {
        server search-audit-service:8000;
    }

    # Мы делим трафик: 90% к v1, 10% к v2
    split_clients "${remote_addr}${http_user_agent}" $backend_version {
    10%     v2;     # мы отправляем 10% на v2
    *       v1;     # остальное на v1
    }

    # Мы связываем версию и upstream
    map $backend_version $user_service_backend {
        v1      user_service_v1;
        v2      user_service_v2;
        default user_service_v1;
    }

    server {
        listen 80;
        server_name localhost;

    # Мы отдаём статический фронтенд
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

    # Мы проксируем user API с канарейкой
        location /api/users/ {
            # Мы пробрасываем версию в заголовок
            add_header X-Backend-Version $backend_version always;
            
            proxy_pass http://$user_service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Backend-Version $backend_version;
            
            # Мы задаём таймауты
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

    # Мы проксируем document API
        location /api/documents/ {
            proxy_pass http://document_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

    # Мы проксируем search API и кешируем ответы
        location /api/search/ {
            # Мы кешируем GET на 5 минут
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_key "$uri$is_args$args";
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://search_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

    # Мы проксируем audit API
        location /api/audit/ {
            proxy_pass http://audit_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    # Мы пробрасываем health-check маршруты
        location /health/user-v1 {
            proxy_pass http://user_service_v1/health;
        }

        location /health/user-v2 {
            proxy_pass http://user_service_v2/health;
        }

        location /health/document {
            proxy_pass http://document_service/health;
        }

        location /health/search {
            proxy_pass http://search_service/health;
        }

    # Мы пробрасываем метрики
        location /metrics/user-v1 {
            proxy_pass http://user_service_v1/metrics;
        }

        location /metrics/user-v2 {
            proxy_pass http://user_service_v2/metrics;
        }

        location /metrics/document {
            proxy_pass http://document_service/metrics;
        }

        location /metrics/search {
            proxy_pass http://search_service/metrics;
        }

    # Мы включаем stub_status
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.0.0.0/8;  # мы разрешаем доступ из docker сети
            deny all;
        }
    }
}
