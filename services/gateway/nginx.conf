user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Мы включаем gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Мы настраиваем прокси-кеш
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

    # Мы задаём лимиты по скорости (увеличено для нагрузочных тестов)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=write_limit:10m rate=200r/s;

    # Мы делим трафик между версиями (используем remote_addr + user_agent для корректного распределения)
    split_clients "${remote_addr}${http_user_agent}" $backend_variant {
        20%     v2;
        *       v1;
    }

    # Мы описываем upstream для канареек
    upstream user_backend_v1 {
        least_conn;
        server user-service-v1:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream user_backend_v2 {
        least_conn;
        server user-service-v2:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream document_backend {
        least_conn;
        server document-service:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream search_backend {
        least_conn;
        server search-service:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream audit_backend {
        server audit-service:8000 max_fails=3 fail_timeout=30s;
    }

    # Мы настраиваем основной сервер
    server {
        listen 80;
        server_name localhost;

    # Мы добавляем заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

    # Мы отдаём healthcheck
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

    # Мы открываем stub_status для мониторинга
        location /stub_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # мы разрешаем docker-сети
            deny all;
        }

    # Мы отдаём статический фронтенд
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

    # Мы проксируем user API
        location /api/users {
            limit_req zone=api_limit burst=20 nodelay;
            
            # Мы выбираем backend по раскладке
            set $user_backend user_backend_v1;
            if ($backend_variant = v2) {
                set $user_backend user_backend_v2;
            }
            
            proxy_pass http://$user_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Backend-Version $backend_variant;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Мы выключаем кеш для user эндпоинтов
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

    # Мы проксируем document API
        location /api/documents {
            limit_req zone=write_limit burst=300 nodelay;
            
            proxy_pass http://document_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Мы кешируем только GET
            proxy_cache api_cache;
            proxy_cache_methods GET;
            proxy_cache_key "$scheme$request_method$host$request_uri$args";
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status always;
        }

    # Мы проксируем search API
        location /api/search {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://search_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Мы используем агрессивный кеш
            proxy_cache api_cache;
            proxy_cache_methods GET;
            proxy_cache_key "$scheme$request_method$host$request_uri$args";
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
        }

    # Мы проксируем audit API
        location /api/audit {
            # Мы ставим более жёсткий лимит
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://audit_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Мы отключаем кеш для аудита
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

    # Мы описываем страницы ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
